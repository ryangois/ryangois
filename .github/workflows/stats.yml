name: Refresh language stats

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate languages.svg (public + private repos)
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: node scripts/stats.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/languages.svg assets/languages-light.svg
          git diff --cached --quiet || (git commit -m "Refresh language stats" && git push)
